name: Deploy static site to GitHub Pages
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: orgo-mechanisms-practice/package-lock.json }
      - run: npm install
        working-directory: orgo-mechanisms-practice
      - run: npm run test && VITE_BASE=/${{ github.event.repository.name }}/ npm run build
        working-directory: orgo-mechanisms-practice
      - uses: actions/upload-pages-artifact@v3
        with: { path: orgo-mechanisms-practice/dist }
  deploy:
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
